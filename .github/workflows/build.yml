name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Fake Logo Icon
        run: |
          mkdir -p src/common
          # Создаем простейший прозрачный PNG-файл размером 192x192 прямо из консоли
          echo "iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAMAAABlinesAAAAA1BMVEUAAACnej3aAAAAAXRSTlMAQObYZgAAADFJREFUeN7twQEBAAAAgiD/r25IQAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMgMeAAB7mzeegAAAABJRU5ErkJggg==" | base64 -d > src/common/logo.png
      - name: Build project
        run: |
          npm install
          npx aiot build
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: |
            dist/*.rpk
            src/dist/*.rpk
            **/*.rpk
          if-no-files-found: error
