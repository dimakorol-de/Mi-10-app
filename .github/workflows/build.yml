name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build project
        run: |
          npm install
          npx aiot build --no-validate
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: |
            dist/*.rpk
            src/dist/*.rpk
            **/*.rpk
          if-no-files-found: error
